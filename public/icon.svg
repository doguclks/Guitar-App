<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#f59e0b" stroke-width="6" opacity="0.25"/>

  <!-- Stylized Guitar Body & Neck -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Guitar Body (Lower & Upper Bout) -->
    <path d="M 256 180 C 210 180 180 215 180 260 C 180 285 195 305 210 320 C 170 345 150 380 150 420 C 150 475 195 500 256 500 C 317 500 362 475 362 420 C 362 380 342 345 302 320 C 317 305 332 285 332 260 C 332 215 302 180 256 180 Z" fill="url(#amberGrad)"/>
    
    <!-- Sound Hole -->
    <circle cx="256" cy="380" r="45" fill="#18181b"/>
    <circle cx="256" cy="380" r="50" fill="none" stroke="#fef3c7" stroke-width="4"/>

    <!-- Guitar Neck -->
    <rect x="242" y="20" width="28" height="200" fill="#d97706" rx="4"/>
    
    <!-- Headstock -->
    <path d="M 238 20 L 235 -30 L 277 -30 L 274 20 Z" fill="#b45309" rx="6"/>

    <!-- Tuning pegs -->
    <circle cx="225" cy="-15" r="7" fill="#fbbf24"/>
    <circle cx="225" cy="5" r="7" fill="#fbbf24"/>
    <circle cx="287" cy="-15" r="7" fill="#fbbf24"/>
    <circle cx="287" cy="5" r="7" fill="#fbbf24"/>

    <!-- Strings -->
    <line x1="248" y1="-20" x2="248" y2="440" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    <line x1="253" y1="-20" x2="253" y2="440" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
    <line x1="259" y1="-20" x2="259" y2="440" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
    <line x1="264" y1="-20" x2="264" y2="440" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Bridge -->
    <rect x="230" y="440" width="52" height="14" rx="4" fill="#78350f"/>
  </g>
</svg>
